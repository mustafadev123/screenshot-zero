name: screenshot_zero
description: A Digital Darkroom for unfinished intentions with on-device screenshot OCR.
publish_to: 'none'
version: 1.5.0+6

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  image_picker: ^1.2.3
  image_picker_android: ^0.8.13+23
  image_picker_platform_interface: ^2.11.1
  google_mlkit_text_recognition: ^0.15.0
  android_intent_plus: ^5.3.1
  url_launcher: ^6.3.2
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  purchases_flutter: ^9.10.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  crypto: ^3.0.6
  http: ^1.6.0
  http_parser: ^4.1.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
